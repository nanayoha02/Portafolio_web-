<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Admin | Yohana Franceschi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    :root {
      --bg: #0f172a;
      --bg-card: #1e293b;
      --bg-input: #0f172a;
      --primary: #6366f1;
      --primary-light: #3b82f6;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border-color: #334155;
      --font-sans: 'Inter', -apple-system, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      background-image:
        radial-gradient(600px at 10% 10%, rgba(99, 102, 241, 0.15), transparent 60%),
        radial-gradient(600px at 90% 90%, rgba(34, 197, 94, 0.08), transparent 60%);
    }

    .login-container {
      background: var(--bg-card);
      padding: 48px 40px;
      border-radius: 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      animation: fadeUp 0.6s ease;
    }

    .login-container h2 {
      font-family: var(--font-sans);
      color: var(--text-primary);
      font-weight: 800;
      font-size: 2rem;
      margin-bottom: 4px;
      letter-spacing: -0.02em;
    }

    .login-container h2 span {
      background: linear-gradient(90deg, #6366f1, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-container p {
      color: var(--text-secondary);
      margin-bottom: 32px;
      font-size: 0.9rem;
    }

    .login-container input {
      width: 100%;
      padding: 14px 18px;
      margin: 8px 0;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .login-container input:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .login-container input::placeholder { color: var(--text-muted); }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #6366f1, #3b82f6);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 16px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 18px rgba(99, 102, 241, 0.35);
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 26px rgba(99, 102, 241, 0.5);
    }

    .back-link {
      margin-top: 24px;
      display: inline-block;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .back-link:hover { color: var(--primary); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Admin<span>.</span></h2>
    <p>Acceso al panel de administraci&oacute;n</p>
    <form id="login-form">
      <input type="email" id="email" placeholder="Correo electr&oacute;nico" required autocomplete="email">
      <input type="password" id="password" placeholder="Contrase&ntilde;a" required autocomplete="current-password">
      <button type="submit" class="btn-login">Entrar al Dashboard</button>
    </form>
    <a href="index.html" class="back-link">&larr; Volver al sitio</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
